<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scrum Studio</title><link rel="stylesheet" href="/style.css"></head>
<body><aside><a class="brand" href="/">◈ <span>scrum<span class="light">studio</span></span></a><div class="workspace-label">WORKSPACE</div><label class="sr" for="project">Project</label><select id="project"></select><button id="new-project" class="new-project">＋ New project</button><div class="workspace-label">PROJECT</div><nav><button data-page="Projects">▣ <span>Project folders</span></button><button data-page="Board" class="active">▦ <span>Board</span></button><button data-page="Notes">☑ <span>Notes</span><i id="review-count">0</i></button><button data-page="Chat">☏ <span>Chat</span></button><button data-page="Users">♙ <span>Users</span></button><button data-page="Agents">◉ <span>Agents</span></button><button data-page="Metrics">▥ <span>Metrics</span></button><button data-page="File locks">▤ <span>File locks</span></button><button data-page="Settings">⚙ <span>Settings</span></button></nav><div class="aside-bottom"><div class="agent-dot"></div><b>Built for human + AI</b><p>One workspace. Shared progress.</p><button data-page="AI workflow">⌘ MCP & workflow</button></div></aside>
<main><header><span id="breadcrumb">Workspace / Board</span><div class="user-controls"><select id="current-user" aria-label="Current human user"></select><button id="new-user">＋ User</button><button id="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">☾ Dark</button></div></header><section class="page-heading"><div><div class="eyebrow">MAKE ROOM FOR GREAT WORK</div><h1 id="heading">Project board</h1><p id="subtitle">A clear view of what’s next, what’s moving, and what’s done.</p></div><button id="add" class="primary">＋ Create task</button></section><section id="agent-controls" class="agent-controls" aria-label="Project agent controls"><span id="agent-counts"></span><button id="project-wakeup">Wakeup</button><button id="project-stop" class="danger">Stop</button><button id="control-agents">Manage agents</button><span id="control-status" role="status" aria-live="polite"></span><span id="control-next-step"></span></section><section class="toolbar"><div class="view-label">▦ <b id="view-label">Kanban board</b></div><div id="board-views" class="view-switch" role="group" aria-label="Task view"><button type="button" data-board-view="board" aria-pressed="true">Board</button><button type="button" data-board-view="list" aria-pressed="false">Task list</button></div><div id="list-options" hidden><label>Group by <select id="task-group" aria-label="Group tasks by"><option value="none">None</option><option value="status">Status</option><option value="priority">Priority</option><option value="owner">Owner</option><option value="context">Context group</option><option value="batch">Agent batch</option><option value="category">Category</option></select></label><label>Sort by <select id="task-sort" aria-label="Sort tasks by"><option value="updated">Updated</option><option value="code">Code</option><option value="title">Title</option><option value="status">Status</option><option value="priority">Priority</option><option value="owner">Owner</option><option value="context">Context group</option><option value="batch">Agent batch</option><option value="model">Model</option></select></label><button type="button" id="task-sort-direction" aria-label="Toggle task sort direction">↓ Descending</button></div><select id="category-filter" aria-label="Filter category"><option value="">All categories</option></select><input id="search" placeholder="Search tasks…" aria-label="Search tasks"><span id="task-count"></span></section><div id="content"></div><div id="error" role="alert"></div></main>
<dialog id="editor"><form id="editor-form"><div class="modal-heading"><h2 id="dialog-title">Create task</h2><button type="button" id="close" aria-label="Close">✕</button></div><div id="fields"></div><div class="form-footer"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save changes</button></div><p id="form-error" role="alert"></p></form></dialog><script src="/app.js"></script></body></html>
